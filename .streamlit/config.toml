[server]
fileWatcherType = "auto"
headless = true
enableWebsocketCompression = false
# Bind to all interfaces (required for Streamlit Cloud container routing)
address = "0.0.0.0"

[client]
showErrorDetails = true

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#f1f5f9"
font = "sans serif"